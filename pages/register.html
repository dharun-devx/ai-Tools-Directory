<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create your AI Directory account."><title>Create account — AI Directory</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-white antialiased">
  <header class="border-b border-white/10"><nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5"><a href="../index.html" class="text-xl font-bold"><span class="text-violet-400">✦</span> AI Directory</a><a class="text-sm text-slate-300 hover:text-white" href="login.html">Already a member? Log in →</a></nav></header>
  <main class="mx-auto max-w-md px-6 py-16"><div class="rounded-2xl border border-white/10 bg-white/[0.03] p-8"><p class="text-sm font-semibold uppercase tracking-widest text-violet-300">Get started</p><h1 class="mt-2 text-3xl font-bold">Create your account</h1><p class="mt-2 text-sm text-slate-400">Save and organize the tools you love.</p><form action="#" method="get" class="mt-8 space-y-5"><div><label for="name" class="mb-2 block text-sm font-medium">Name</label><input id="name" name="name" autocomplete="name" required class="w-full rounded-lg border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none focus:border-violet-400"></div><div><label for="email" class="mb-2 block text-sm font-medium">Email address</label><input id="email" name="email" type="email" autocomplete="email" required class="w-full rounded-lg border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none focus:border-violet-400"></div><div><label for="password" class="mb-2 block text-sm font-medium">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required class="w-full rounded-lg border border-white/10 bg-slate-900 px-4 py-3 text-sm outline-none focus:border-violet-400"><p class="mt-2 text-xs text-slate-500">Use at least 8 characters.</p></div><button type="submit" class="w-full rounded-lg bg-violet-500 px-5 py-3 text-sm font-semibold hover:bg-violet-400">Create account</button></form><p class="mt-6 text-center text-xs text-slate-500">Static demo only — account creation is not configured.</p></div></main>
</body>
</html>
